# --- run / data ---
dataset: endoscopy
seed: 42
batch_size: 4
epochs: 1
num_workers: 0          # keep 0 unless you rework device moves
subset: 0               # 0 = full dataset
train_tf_kind: aug
val_tf_kind: basic
model_type: mask2former

image_size: [448, 448]

# --- backbone ---
vit_name: facebook/dinov3-vitl16-pretrain-lvd1689m
vit_ckpt: null          # or path to weights
freeze_encoder: false
unfreeze_last_k: 0

# --- adapter / decoder / head hyperparams ---
interaction_indexes: [5, 11, 17, 23]
transformer_in_features: ["1","2","3"]
nheads: 8
dim_feedforward: 1024
enc_layers: 3
dec_layers: 6
common_stride: 4
num_queries: 100

# --- optimization (used by LightningModule) ---
lr: 1.0e-4
weight_decay: 0.05
llrd: 0.8
llrd_l2_enabled: true
lr_multi: 1.5
warmup_non_vit_epochs: 2
warmup_vit_epochs: 3
poly_power: 0.9

# --- mask2former loss weights / sampling ---
num_points: 12544
oversample_ratio: 3.0
importance_sample_ratio: 0.75
no_object_coefficient: 0.1
mask_coefficient: 5.0
dice_coefficient: 5.0
class_coefficient: 2.0

# --- EoMT flags (kept for compatibility, but masked attention is disabled here) ---
eomt_masked_attn_enabled: false

# --- logging ---
wandb_project: Internship-medical-vit-segmentation
experiment_id: auto
subset: 20

non_vit_warmup: 1
vit_warmup: 2
